<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Raven Community</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0507;--red:#c1121f;--red2:#7a0a12;--card:#150a0d;--line:#3a1015;--txt:#f4eaea;--mut:#b49a9d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--txt);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
background:radial-gradient(120% 70% at 85% -10%,#8e0f1a 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#5c070f 0%,transparent 60%),linear-gradient(#0a0507,#120609);background-attachment:fixed}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.crow{position:absolute;left:-60px;width:34px;height:20px;opacity:.85;animation:fly linear infinite}
.crow svg{width:100%;height:100%;display:block;overflow:visible}
.wing{transform-origin:20px 14px;animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-28deg) scaleY(1)}to{transform:rotate(22deg) scaleY(.6)}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30vw,-18px)}50%{transform:translate(65vw,10px)}75%{transform:translate(100vw,-14px)}100%{transform:translate(128vw,4px)}}
@media (prefers-reduced-motion:reduce){.crow,.wing{animation:none}}
header,main,footer{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px}
header{padding-top:22px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;direction:ltr}
.logo svg{width:44px;height:44px;filter:drop-shadow(0 0 8px #c1121f)}
h1{margin:0;font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:.5px;font-family:Georgia,'Vazirmatn',serif}
h1 b{color:var(--red)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 14px}
.fake{display:inline-block;background:#2a0b0f;border:1px solid var(--red2);color:#ff8d94;border-radius:99px;padding:3px 12px;font-size:12px}
nav{display:flex;gap:8px;margin:18px 0 14px;overflow-x:auto;padding-bottom:4px}
nav button{flex:1 0 auto;background:#14080b;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:linear-gradient(135deg,var(--red),var(--red2));border-color:var(--red);box-shadow:0 0 18px #c1121f55}
nav small{display:block;font-weight:400;opacity:.75;font-size:11px}
.sbox{display:flex;gap:8px}
.sbox input{flex:1;min-width:0;background:#0f0709ee;border:1px solid var(--red2);color:var(--txt);padding:14px 16px;border-radius:12px;font-size:16px;font-family:inherit;outline:none}
.sbox input:focus{border-color:var(--red);box-shadow:0 0 0 3px #c1121f44}
.sbox button{background:var(--red);border:0;color:#fff;padding:0 20px;border-radius:12px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.stats{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.stat{background:#14080bcc;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:12px;color:var(--mut)}
.stat b{display:block;color:var(--txt);font-size:18px}
.info{color:var(--mut);font-size:13px;margin:8px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:14px}
.card{background:linear-gradient(160deg,#1a0b0fee,#0e0709ee);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.card:hover{border-color:var(--red)}
.card img{width:64px;height:64px;border-radius:50%;border:2px solid var(--red);flex:none;background:#000}
.card h3{margin:0 0 6px;font-size:15px;line-height:1.5}
.row{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed #2a1217}
.row:last-child{border:0}
.row span:last-child{color:var(--txt);direction:ltr;text-align:left;word-break:break-all}
.body{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#2a0b0f;color:#ff9aa1;border:1px solid var(--red2);margin-bottom:6px}
.tag.ok{color:#8fe3a5;border-color:#1f5a30;background:#0b1d11}
.more{display:block;margin:6px auto 24px;background:#14080b;border:1px solid var(--red2);color:var(--txt);padding:10px 26px;border-radius:12px;font-family:inherit;cursor:pointer}
.empty{text-align:center;padding:40px 10px;color:var(--mut);border:1px dashed var(--red2);border-radius:16px;margin:10px 0 24px}
footer{text-align:center;color:#7d676a;font-size:12px;padding:10px 16px 28px}

#home{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:6px 16px 10px}
.total{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 18px}.total b{color:var(--txt);font-size:20px;margin:0 4px}
.gt{display:flex;align-items:center;gap:10px;margin:22px 2px 10px;font-size:15px;font-weight:700}
.gt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--red2),transparent)}
html[dir=rtl] .gt::after{background:linear-gradient(270deg,var(--red2),transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;overflow:hidden;text-align:right;font-family:inherit;color:var(--txt);cursor:pointer;background:linear-gradient(155deg,#220d12ee,#0e0709ee);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--red);box-shadow:0 8px 24px #c1121f33;outline:none}
.tile .ic{font-size:30px;line-height:1;margin-bottom:6px}
.tile b{font-size:16px}.tile small{color:var(--mut);font-size:12px;direction:ltr;text-align:right}
.tile .n{position:absolute;top:12px;left:12px;background:#2a0b0f;border:1px solid var(--red2);color:#ff9aa1;border-radius:99px;padding:2px 10px;font-size:12px}
.topbar{display:flex;align-items:center;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
.topbar button{background:#14080b;border:1px solid var(--red2);color:var(--txt);padding:9px 14px;border-radius:10px;font-family:inherit;cursor:pointer}
#vt{font-weight:800;font-size:18px;flex:1;min-width:120px}#vt small{display:block;font-weight:400;font-size:11px;color:var(--mut);direction:ltr;text-align:right}
#sw{background:#14080b;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-family:inherit;max-width:100%}

body.locked header,body.locked #home,body.locked #view,body.locked footer{display:none!important}
#login[hidden]{display:none}
#login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));background:radial-gradient(70% 60% at 50% 40%,#2a050b99,#05020399);transition:opacity .7s ease,transform .7s ease,filter .7s ease}
#login.out{opacity:0;transform:scale(1.08);filter:blur(6px);pointer-events:none}
.lcard{position:relative;width:min(100%,380px);border-radius:26px;overflow:hidden;animation:rise .9s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 30px 80px #000c,0 0 60px #c1121f33}
.lcard::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 55%,#c1121f 75%,#ff5a66 85%,transparent 100%);animation:spin 5s linear infinite}
.lcard::after{content:"";position:absolute;inset:2px;border-radius:24px;background:linear-gradient(160deg,#1c0a0eee,#080406f2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lin{position:relative;z-index:1;padding:30px 24px 26px;text-align:center}
.lin>*{animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
.lin>*:nth-child(1){animation-delay:.25s}.lin>*:nth-child(2){animation-delay:.35s}.lin>*:nth-child(3){animation-delay:.45s}.lin>*:nth-child(4){animation-delay:.55s}.lin>*:nth-child(5){animation-delay:.65s}.lin>*:nth-child(6){animation-delay:.75s}
.llogo{width:78px;height:78px;margin:0 auto 6px;animation:rise .8s .25s both,float 3.2s ease-in-out infinite}
.llogo svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #c1121f)}
.lt{font:800 28px Georgia,'Vazirmatn',serif;direction:ltr;margin:4px 0 2px}.lt b{color:var(--red)}
.ls{color:var(--mut);font-size:13px;margin-bottom:20px}
.fld{position:relative;margin-bottom:14px;text-align:right}
.fld input{width:100%;background:#0c0507;border:1px solid var(--red2);border-radius:14px;color:var(--txt);padding:20px 16px 8px;font-size:16px;font-family:inherit;direction:ltr;text-align:left;outline:none;transition:border-color .2s,box-shadow .2s}
.fld.pw input{padding-right:46px}
.fld label{position:absolute;right:16px;top:15px;color:var(--mut);font-size:14px;pointer-events:none;transition:all .2s;transform-origin:right top}
.fld input:focus{border-color:var(--red);box-shadow:0 0 0 4px #c1121f33,0 0 24px #c1121f44}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:6px;font-size:11px;color:#ff8d94}
#eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:6px}
#lb{position:relative;width:100%;margin-top:6px;border:0;border-radius:14px;padding:15px;font:800 16px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(120deg,#c1121f,#7a0a12,#c1121f);background-size:200% 100%;animation:rise .8s .75s both,shine 4s linear infinite;transition:transform .15s,box-shadow .2s}
#lb:hover{box-shadow:0 8px 28px #c1121f66}#lb:active{transform:scale(.97)}
#lb .sp{display:none;width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;margin:0 auto;animation:spin .7s linear infinite}
#lb.load .tx{display:none}#lb.load .sp{display:block}
#le{min-height:20px;margin-top:12px;color:#ff7b84;font-size:13px}
.lcard.shake{animation:shake .5s}
.lcard.good::before{background:conic-gradient(from 0deg,#2fbf6b,#8fe3a5,#2fbf6b);animation-duration:1.2s}
.lcard.good{box-shadow:0 0 70px #2fbf6b66;transition:transform .5s;transform:scale(1.04)}
.lo{display:block;margin:0 auto 12px;background:#14080b;border:1px solid var(--red2);color:var(--txt);border-radius:10px;padding:7px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-12px)}30%{transform:translateX(10px)}45%{transform:translateX(-8px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.lcard,.lcard::before,.lin>*,.llogo,#lb{animation:none!important}}
</style>
<script>window.addEventListener('error',function(e){try{var d=document.createElement('pre');d.style.cssText='position:relative;z-index:9;margin:8px;padding:8px;background:#300;color:#fcc;font:12px monospace;white-space:pre-wrap;direction:ltr';d.textContent='ERROR: '+e.message+' @'+e.lineno+':'+e.colno;document.body.insertBefore(d,document.body.firstChild)}catch(x){}});</script>
</head>

for(const k in SECTIONS){const s=SECTIONS[k];s.ix=s.data.map(s.idx)}
let cur='korek',res=[],shown=0;const PAGE=24;
const GROUPS=[['📡 پەیوەندی و دارایی',['korek','fastpay']],['🏛 دامودەزگا حکومییەکان',['mp','media','sec','edu']],['🎓 پەیمانگای ماد',['mad','madc']]];
const ICON={korek:'📱',fastpay:'💳',mp:'🏛️',media:'📡',sec:'🛡️',edu:'🏫',mad:'🎓',madc:'📜'};
(function(){let tot=0,hh='',sel='';for(const [gn,ks] of GROUPS){hh+='<div class="gt">'+gn+'</div><div class="tiles">';sel+='<optgroup label="'+gn+'">';
for(const k of ks){const s=SECTIONS[k];tot+=s.data.length;hh+=`<button class="tile" data-k="${k}"><span class="n">${s.data.length.toLocaleString('en')}</span><span class="ic">${ICON[k]}</span><b>${s.label}</b><small>${s.sub}</small></button>`;sel+=`<option value="${k}">${s.label}</option>`}
hh+='</div>';sel+='</optgroup>'}
$('#groups').innerHTML=hh;$('#sw').innerHTML=sel;$('#total').innerHTML='کۆی هەموو تۆمارەکان:<b>'+tot.toLocaleString('en')+'</b>· '+Object.keys(SECTIONS).length+' بەش';
$('#groups').onclick=e=>{const t=e.target.closest('.tile');if(t)setTab(t.dataset.k)};$('#sw').onchange=e=>setTab(e.target.value);$('#back').onclick=showHome})();
function showHome(){$('#view').hidden=true;$('#home').hidden=false;window.scrollTo(0,0)}
function setTab(k){cur=k;$('#home').hidden=true;$('#view').hidden=false;$('#sw').value=k;const s=SECTIONS[k];$('#vt').innerHTML=ICON[k]+' '+s.label+'<small>'+s.sub+'</small>';$('#q').placeholder=s.ph;$('#q').value='';
$('#stats').innerHTML=s.stats(s.data).map(([a,b])=>`<div class="stat">${a}<b>${b}</b></div>`).join('');search();window.scrollTo(0,0)}
function search(){const s=SECTIONS[cur],qraw=$('#q').value,qt=normT(qraw),qd=digits(qraw);res=[];
if(!qt){res=s.data}else{const words=qt.split(' ');const numeric=qd.length>=3&&qd.length>=qt.replace(/\s/g,'').length-1;
s.ix.forEach((x,i)=>{const ok=numeric?x.d.includes(qd):words.every(w=>x.t.includes(w));if(ok)res.push(s.data[i])})}
shown=0;$('#grid').innerHTML='';render();
$('#info').textContent=qt?(res.length?`${res.length} ئەنجام دۆزرایەوە`:''):`هەموو تۆمارەکان (${res.length}) — بنووسە بۆ گەڕان`}
function render(){const s=SECTIONS[cur];const part=res.slice(shown,shown+PAGE);shown+=part.length;
const g=$('#grid');if(!res.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">هیچ داتایەک نەدۆزرایەوە 🪶</div>'}
else g.insertAdjacentHTML('beforeend',part.map(r=>`<div class="card">${s.card(r)}</div>`).join(''));
$('#more').hidden=shown>=res.length}
$('#more').onclick=render;$('#go').onclick=search;
let t;$('#q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(search,180)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

(function(){const sky=$('#sky');const svg='<svg viewBox="0 0 40 24"><g class="wing"><path fill="#000" d="M20 14C14 4 6 2 0 4c6 2 10 6 12 12z"/></g><path fill="#050203" stroke="#c1121f" stroke-width=".6" d="M12 15c4-5 10-6 15-3l7-2-5 5c-2 5-8 7-14 5l-3 3z"/><g class="wing" style="animation-delay:-.25s"><path fill="#000" d="M20 14C26 4 34 1 40 3c-6 3-10 7-12 13z"/></g><circle cx="29" cy="12" r=".9" fill="#c1121f"/></svg>';
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='crow';const sc=.7+Math.random()*.9;
d.style.top=(5+Math.random()*75)+'vh';d.style.width=(34*sc)+'px';d.style.height=(20*sc)+'px';d.style.animationDuration=(16+Math.random()*20)+'s';d.style.animationDelay='-'+(Math.random()*30)+'s';d.innerHTML=svg;sky.appendChild(d)}})();

(function(){const H='5cee2731e92749b3ae01c81d638fc0b99031ff23525df5bfba5b3d1193a6888d';
const L=$('#login'),f=$('#lf'),u=$('#lu'),p=$('#lp'),b=$('#lb'),e=$('#le'),card=$('#lc');
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function ok(a,c){try{return (await sha(a+':'+c))===H}catch(_){return a==='RVN'&&c==='3abaaa'}}
function unlock(fast){document.body.classList.remove('locked');if(fast){L.hidden=true;return}L.classList.add('out');setTimeout(()=>{L.hidden=true},700)}
function lock(){document.body.classList.add('locked');L.classList.remove('out');card.classList.remove('good','shake');u.value='';p.value='';e.textContent='';p.type='password';L.hidden=false;showHome();setTimeout(()=>u.focus(),100)}
let authed=false;try{authed=sessionStorage.getItem('rv')==='1'}catch(_){}
if(authed){unlock(true)}else{L.hidden=false}
$('#eye').onclick=()=>{p.type=p.type==='password'?'text':'password'};
f.addEventListener('submit',async ev=>{ev.preventDefault();e.textContent='';b.classList.add('load');
await new Promise(r=>setTimeout(r,800));const good=await ok(u.value.trim(),p.value);b.classList.remove('load');
if(good){card.classList.add('good');try{sessionStorage.setItem('rv','1')}catch(_){}setTimeout(()=>unlock(),650)}
else{card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');e.textContent='ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە';p.value='';p.focus()}});
$('#logout').onclick=()=>{try{sessionStorage.removeItem('rv')}catch(_){}lock()};
})();
</script>
